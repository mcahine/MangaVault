name: 功能建议
description: 提出一个新能力或改进
title: '[建议] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        本项目有一条硬约束：**零第三方运行时依赖**（只用 `node:` 标准库与相对路径）。
        需要引入依赖的建议请说明为什么标准库做不到。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: '描述场景，而不是直接给方案 —— 场景比方案更容易找到更好的实现'
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法（可选）
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块（可多选，见 docs/INDEX.md）
      multiple: true
      options:
        - library（漫画库 / 索引 / 扫描）
        - reader（阅读器）
        - download（哔咔下载）
        - dedupe（查重）
        - vault（管理台）
        - desktop（桌面宿主 / 启动器）
        - core（配置 / HTTP / 存储）
    validations:
      required: false

  - type: checkboxes
    id: rules
    attributes:
      label: 自检
      options:
        - label: 我确认这个建议不需要引入第三方运行时依赖（或已在上文说明理由）
          required: true
